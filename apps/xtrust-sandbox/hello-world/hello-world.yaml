# Hello-world web page. You can copy this file into your own folder as a start.
#
# Argo CD deploys this file from the `main` branch. Do not `kubectl apply` it by
# hand: change it in a branch, open a pull request, and it is deployed once the
# pull request is approved and merged.
#
# There is no `namespace:` in this file: Argo CD fills in the namespace that
# belongs to the folder.

# 1. The page itself, stored in the cluster as a ConfigMap (a small bag of files/settings).
apiVersion: v1
kind: ConfigMap
metadata:
  name: hello-world
data:
  index.html: |
    <!doctype html>
    <html>
      <head><meta charset="utf-8"><title>Hello world</title></head>
      <body style="font-family:sans-serif;max-width:600px;margin:3em auto;">
        <h1>Hello, world!</h1>
        <p>Deployed from the xtrust-gitops repository.</p>
      </body>
    </html>
---
# 2. The Deployment: "keep 3 copies (pods) of this nginx web server running".
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hello-world          # which pods belong to this Deployment
  template:                     # the pod recipe
    metadata:
      labels:
        app: hello-world
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 80
          volumeMounts:         # put the ConfigMap's index.html where nginx serves it
            - name: html
              mountPath: /usr/share/nginx/html/index.html
              subPath: index.html
          readinessProbe:       # only send traffic once the page answers
            httpGet:
              path: /
              port: 80
          livenessProbe:        # restart the container if it stops answering
            httpGet:
              path: /
              port: 80
          resources:
            requests:           # what the pod reserves on a node
              cpu: 25m
              memory: 32Mi
            limits:             # the most it may use
              memory: 64Mi
      volumes:
        - name: html
          configMap:
            name: hello-world
---
# 3. The Service: one stable internal name/IP in front of the pods.
apiVersion: v1
kind: Service
metadata:
  name: hello-world
spec:
  selector:
    app: hello-world            # send traffic to pods with this label
  ports:
    - port: 80
      targetPort: 80
