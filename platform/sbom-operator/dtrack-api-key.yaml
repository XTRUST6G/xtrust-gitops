# Encrypted with sealed-secrets-cert.pem; only the cluster can decrypt it.
# Dependency-Track API key of the team sbom-operator (upload SBOMs, create and manage projects).
# Sync wave -1: created before sbom-operator starts.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  name: dtrack-api-key
  namespace: sbom-operator
spec:
  encryptedData:
    api-key: 
  template:
    metadata:
      name: dtrack-api-key
      namespace: sbom-operator
