# sbom-operator: runs Syft on every image running in the cluster and uploads the
# software list (SBOM, CycloneDX) to Dependency-Track. New or changed pods are
# picked up right away; images that no longer run are removed there too.
#
# In Dependency-Track each image is a project (name = image, version = tag),
# tagged with xtrust-6g/<namespace>, so you can filter by partner.
#
# Two sources:
#   1. the Helm chart
#   2. platform/sbom-operator/: the Dependency-Track API key (SealedSecret)
#
# ADMIN ONLY: everything in platform/ is installed with cluster-wide rights.
# Settings: https://github.com/ckotzbauer/sbom-operator#readme
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sbom-operator
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io   # deleting this file uninstalls the tool
spec:
  project: platform
  sources:
    - repoURL: https://ckotzbauer.github.io/helm-charts
      chart: sbom-operator
      targetRevision: 0.51.1        # sbom-operator 0.50.1, Syft built in
      helm:
        valuesObject:
          args:
            targets: dtrack
            format: cyclonedxjson
            dtrack-base-url: http://dependency-track-api-server.dependency-track.svc.cluster.local:8080
            kubernetes-cluster-id: xtrust-6g
            dtrack-kubernetes-cluster-id-mode: tag-namespace
          envVars:
            - name: SBOM_DTRACK_API_KEY
              valueFrom:
                secretKeyRef:
                  name: dtrack-api-key   # platform/sbom-operator/dtrack-api-key.yaml
                  key: api-key
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi              # Syft needs room for large images
    - repoURL: https://github.com/XTRUST6G/xtrust-gitops.git
      targetRevision: main
      path: platform/sbom-operator
  destination:
    server: https://kubernetes.default.svc
    namespace: sbom-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: baseline
